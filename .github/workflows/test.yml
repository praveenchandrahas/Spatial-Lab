name: test
on:
  push: {branches: [main]}
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy scipy aiohttp pyyaml pytest
      - run: bash tests/run.sh
      - name: check the page script parses
        run: node --check spatial_lab/web/app.js

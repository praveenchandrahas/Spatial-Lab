# Spatial-Lab layout: the author's 5.1.2 room.
#
# Coordinates: x to the right, y towards the screen, z up, origin at the listening position.
# `dir` is a unit vector from the seat to the speaker. The values are the author's measured
# layout, copied from Omniphony's `current_layout` (~/.config/omniphony/config.yaml).
# `distance_ft` is a rough tape/phone estimate given by the author, used only for placing the
# speakers in the 3D scene and for the optional distance alignment in Direct mode.
# Entries marked `provisional: true` are guesses to be replaced by a measurement.
version: 1
name: "5.1.2 (author's room, measured directions)"

output:
  # PipeWire sink of the 7.1 USB interface and the port suffix of each of its 8 outputs, in order.
  sink: alsa_output.usb-0d8c_USB_Sound_Device-00.analog-surround-71
  port_names: [FL, FR, RL, RR, FC, LFE, SL, SR]

camilladsp:
  capture_node: camilladsp-capture
  playback_node: camilladsp-playback

room:
  width_ft: 10
  depth_ft: 10            # front wall to back wall
  seat_from_back_wall_ft: 1.0   # provisional: "no space behind the seat"
  height_ft: 9.0                # provisional
  ear_height_ft: 2.0            # seated ear height, from the author's notes

speakers:
  # port = index of the interface output (0-based). The heights sit on the RL and RR ports.
  - {name: FL,  port: 0, role: bed,    dir: [-0.437, 0.896, 0.085], distance_ft: 9}
  - {name: FR,  port: 1, role: bed,    dir: [ 0.436, 0.894, 0.099], distance_ft: 9}
  - {name: TFL, port: 2, role: height, dir: [-0.345, 0.458, 0.819], distance_ft: 8.5, provisional: true}
  - {name: TFR, port: 3, role: height, dir: [ 0.374, 0.555, 0.743], distance_ft: 8.5, provisional: true}
  - {name: C,   port: 4, role: bed,    dir: [ 0.000, 0.995, 0.103], distance_ft: 8}
  - {name: LFE, port: 5, role: sub}
  # The surrounds are behind the seat at about +-120 degrees. 3 ft is the author's estimate; the
  # delay (3.7 ms) and trim (-4.4 dB) in the CamillaDSP table would fit roughly 5 ft instead.
  - {name: SL,  port: 6, role: bed,    dir: [-0.812, -0.536, 0.230], distance_ft: 3}
  - {name: SR,  port: 7, role: bed,    dir: [ 0.858, -0.472, 0.203], distance_ft: 3}
